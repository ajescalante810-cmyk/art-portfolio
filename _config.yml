title: Alexander Escalante
name: Alexander Escalante
description: Paintings by Alexander (AJ) Escalante
url: "https://alexanderescalante.com"
baseurl: ""

remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "default"

plugins:
  - jekyll-include-cache

markdown: kramdown
locale: en-US

author:
  name: "Alexander Escalante"
  bio: "Painter working at the intersection of memory and material."

layout: single

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  - scope:
      path: "_gallery"
      type: gallery
    values:
      layout: portfolio-piece

collections:
  pages:
    output: true
    permalink: /:path/
  gallery:
    output: true
    permalink: /paintings/:path/

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
