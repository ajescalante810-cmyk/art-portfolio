<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-79DCEKNRLN"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-79DCEKNRLN');

<script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('img').forEach(function (img) {
    img.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    img.setAttribute('draggable', 'false');
  });
});
</script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (localStorage.getItem('cookie-consent-dismissed')) return;
  var banner = document.createElement('div');
  banner.id = 'cookie-consent-banner';
  banner.innerHTML = '<span>This site uses cookies for analytics.</span> <button type="button" id="cookie-consent-accept">OK</button>';
  document.body.appendChild(banner);
  document.getElementById('cookie-consent-accept').addEventListener('click', function () {
    localStorage.setItem('cookie-consent-dismissed', '1');
    banner.remove();
  });
});
</script>
